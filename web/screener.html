<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>篩選器 — 台股分析</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
<main class="screen-main">
  <header class="desk-page-head">
    <div>
      <div class="desk-kicker">市場研究 / 篩選工作紙</div>
      <h1>全市場篩選器</h1>
      <p class="muted">以已知資料條件縮小研究範圍；結果是候選清單，不是投資建議。</p>
    </div>
    <div class="desk-asof"><span>研究動作</span><strong>定義條件 → 檢視候選</strong></div>
  </header>

  <section class="card screen-filter" aria-labelledby="filter-heading">
    <div class="screen-filter-head"><h2 id="filter-heading">篩選條件</h2><span class="muted">空白欄位不設限制</span></div>
    <div class="flex screen-presets" id="presets"></div>
    <div class="grid cols-4 mt">
      <div><label for="p-rev_yoy_min">月營收 YoY ≥ (%)</label><input type="number" id="p-rev_yoy_min" placeholder="如 10"></div>
      <div><label for="p-insti_buy_days">法人連續買超 ≥ (天)</label><input type="number" id="p-insti_buy_days" placeholder="如 3"></div>
      <div><label for="p-pe_max">本益比 ≤</label><input type="number" id="p-pe_max" placeholder="如 15"></div>
      <div><label for="p-yield_min">殖利率 ≥ (%)</label><input type="number" id="p-yield_min" placeholder="如 4"></div>
      <div><label for="p-pb_max">股價淨值比 ≤</label><input type="number" id="p-pb_max" placeholder="如 2"></div>
      <div><label for="p-near_52w_high">距52週高 ≤ (%)</label><input type="number" id="p-near_52w_high" placeholder="如 5"></div>
      <div><label for="p-vol_surge">量比 ≥ (倍)</label><input type="number" id="p-vol_surge" placeholder="如 2"></div>
      <div><label for="p-min_amount">日成交額 ≥ (百萬)</label><input type="number" id="p-min_amount" placeholder="如 50（流動性門檻）"></div>
    </div>
    <fieldset class="screen-checks">
      <legend>其他條件</legend>
      <label><input type="checkbox" id="p-above_ma60"> 站上60日線</label>
      <label><input type="checkbox" id="p-above_ma240"> 站上年線</label>
      <label><input type="checkbox" id="p-rev_turn_pos"> 營收YoY由負轉正</label>
      <label><input type="checkbox" id="p-rev_accel"> 營收YoY連3月加速</label>
      <label><input type="checkbox" id="p-exclude_etf" checked> 排除ETF</label>
    </fieldset>
    <div class="screen-actions">
      <button id="btn-run" type="button">執行篩選</button>
      <p class="muted">營收條件需先抓取全市場月營收；均線與法人連買需先回填歷史。命中前 10 名會自動預抓深度資料。</p>
    </div>
  </section>

  <section class="card mt screen-results" aria-labelledby="result-title">
    <div class="section-head"><div><h2 id="result-title">篩選結果</h2><p class="muted" id="result-context">尚未執行篩選</p></div></div>
    <div class="scroll-x">
      <table class="data" id="results">
        <thead><tr>
          <th class="l">股票</th><th class="l">產業</th>
          <th class="sortable" data-key="close" aria-sort="none"><button type="button">收盤<span class="arrow" aria-hidden="true"></span></button></th>
          <th class="sortable" data-key="change" aria-sort="none"><button type="button">漲跌<span class="arrow" aria-hidden="true"></span></button></th>
          <th class="sortable" data-key="amount" aria-sort="none"><button type="button">成交額(百萬)<span class="arrow" aria-hidden="true"></span></button></th>
          <th class="sortable" data-key="pe" aria-sort="none"><button type="button">PE<span class="arrow" aria-hidden="true"></span></button></th>
          <th class="sortable" data-key="dividend_yield" aria-sort="none"><button type="button">殖利率<span class="arrow" aria-hidden="true"></span></button></th>
          <th class="sortable" data-key="rev_yoy" aria-sort="none"><button type="button">營收YoY<span class="arrow" aria-hidden="true"></span></button></th>
          <th class="sortable" data-key="insti_net" aria-sort="none"><button type="button">法人淨買(張)<span class="arrow" aria-hidden="true"></span></button></th>
          <th class="sortable" data-key="vol_ratio" aria-sort="none"><button type="button">量比<span class="arrow" aria-hidden="true"></span></button></th>
          <th></th>
        </tr></thead>
        <tbody aria-live="polite"><tr class="table-state"><td colspan="11">選擇條件或套用快速篩選後執行。</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<script src="js/common.js"></script>
<script>
const FIELDS = ["rev_yoy_min","insti_buy_days","pe_max","yield_min","pb_max",
                "near_52w_high","vol_surge","min_amount"];
const CHECKS = ["above_ma60","above_ma240","rev_turn_pos","rev_accel","exclude_etf"];

async function loadPresets() {
  const presets = await api("/api/screener/presets");
  const el = document.getElementById("presets");
  el.innerHTML = `<span class="muted">快速套用：</span>` +
    Object.entries(presets).map(([key, p]) =>
      `<button type="button" class="ghost small" data-key="${key}">${p.label}</button>`).join("");
  el.addEventListener("click", e => {
    const key = e.target.dataset.key;
    if (!key) return;
    clearForm();
    const params = presets[key].params;
    for (const [k, v] of Object.entries(params)) {
      const inp = document.getElementById("p-" + k);
      if (!inp) continue;
      if (inp.type === "checkbox") inp.checked = !!v; else inp.value = v;
    }
    runScreen();
  });
}

function clearForm() {
  FIELDS.forEach(f => document.getElementById("p-" + f).value = "");
  CHECKS.forEach(c => document.getElementById("p-" + c).checked = c === "exclude_etf");
}

function collectParams() {
  const params = {};
  FIELDS.forEach(f => {
    const v = document.getElementById("p-" + f).value;
    if (v !== "") params[f] = parseFloat(v);
  });
  CHECKS.forEach(c => {
    if (document.getElementById("p-" + c).checked) params[c] = true;
  });
  return params;
}

let currentHits = [];
let sortState = { key: "amount", dir: -1 };

function renderResults() {
  const { key, dir } = sortState;
  currentHits.sort((a, b) => {
    const va = a[key], vb = b[key];
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    return (va - vb) * dir;
  });
  document.getElementById("result-title").textContent = `篩選結果（${currentHits.length} 檔）`;
  document.getElementById("result-context").textContent = currentHits.length ? "依成交額由高至低排列，可切換欄位排序。" : "目前條件沒有候選；可檢查資料涵蓋或放寬條件。";
  const tbody = document.querySelector("#results tbody");
  tbody.innerHTML = currentHits.length ? currentHits.map(r => `
    <tr>
      <td class="l"><a href="stock.html?id=${r.stock_id}&from=screener">${r.stock_id} ${r.name}</a></td>
      <td class="l muted">${r.industry || "—"}</td>
      <td>${fmt.num(r.close)}</td>
      <td class="${fmt.cls(r.change)}">${fmt.sign(r.change)}</td>
      <td>${fmt.int((r.amount || 0) / 1e6)}</td>
      <td>${fmt.num(r.pe, 1)}</td>
      <td>${fmt.pct(r.dividend_yield)}</td>
      <td class="${fmt.cls(r.rev_yoy)}">${r.rev_yoy != null ? fmt.signPct(r.rev_yoy) : "—"}</td>
      <td>${r.insti_net != null ? fmt.int(r.insti_net / 1000) : "—"}</td>
      <td>${fmt.num(r.vol_ratio)}</td>
      <td><button class="ghost small" onclick="addWatch('${r.stock_id}', this)">＋觀察</button></td>
    </tr>`).join("")
    : '<tr class="table-state"><td colspan="11">無符合條件的個股。請檢查月營收與歷史資料是否齊全，或放寬條件。</td></tr>';
  document.querySelectorAll("#results th.sortable").forEach(th => {
    const active = th.dataset.key === key;
    th.classList.toggle("active", active);
    th.querySelector(".arrow").textContent = active ? (dir === 1 ? "▲" : "▼") : "";
    th.setAttribute("aria-sort", active ? (dir === 1 ? "ascending" : "descending") : "none");
  });
}

async function runScreen() {
  const btn = document.getElementById("btn-run");
  btn.disabled = true; btn.textContent = "篩選中…";
  document.getElementById("result-context").textContent = "正在依條件讀取市場資料…";
  try {
    currentHits = await api("/api/screener/run", { method: "POST", body: { params: collectParams() } });
    sortState = { key: "amount", dir: -1 };
    renderResults();
  } catch (err) {
    document.getElementById("result-title").textContent = "篩選結果";
    document.getElementById("result-context").textContent = "資料讀取失敗";
    document.querySelector("#results tbody").innerHTML = `<tr class="table-state"><td colspan="11" role="alert">篩選失敗：${String(err.message || err).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}</td></tr>`;
  }
  btn.disabled = false; btn.textContent = "執行篩選";
}

document.querySelector("#results thead").addEventListener("click", e => {
  const th = e.target.closest("button")?.closest("th.sortable");
  if (!th) return;
  const key = th.dataset.key;
  sortState = sortState.key === key ? { key, dir: sortState.dir * -1 } : { key, dir: -1 };
  renderResults();
});

async function addWatch(sid, btn) {
  try {
    await api(`/api/watchlist/${sid}`, { method: "POST", body: { tier: "research" } });
    btn.textContent = "已加入研究中"; btn.disabled = true;
  } catch (err) { toast("加入觀察名單失敗：" + err.message); }
}

document.getElementById("btn-run").addEventListener("click", runScreen);
loadPresets();
</script>
</body>
</html>
